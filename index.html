<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tygrysica – Sklep dla tygrysów</title>
<style>
  :root { --orange:#e8761a; --dark:#f3ede4; --bg:#000; --panel:#111; --line:#2e2a26; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--dark); min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 32px; background:#000; border-bottom:3px solid var(--orange); }
  .logo { cursor:pointer; line-height:1.1; }
  .logo h1 { font-size:28px; color:var(--orange); letter-spacing:1px; }
  .logo small { font-size:12px; color:#a89d90; }
  nav button { background:none; border:none; font-size:16px; font-weight:600; margin-left:12px; padding:10px 18px; border-radius:8px; cursor:pointer; color:var(--dark); }
  nav button:hover { background:var(--orange); color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:32px 20px; }
  h2 { margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:.15s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,.1); }
  .card .img { background:#fff; padding:10px; }
  .card .info { padding:16px; border-top:1px solid var(--line); }
  .card .info h3 { margin-bottom:6px; }
  .price { color:var(--orange); font-weight:700; font-size:20px; }
  .product { display:grid; grid-template-columns:1fr 1fr; gap:32px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .product img, .product svg { width:100%; height:auto; display:block; background:#fff; border-radius:10px; }
  .product h2 { font-size:32px; }
  .product p { margin:14px 0; line-height:1.6; color:#c9c0b4; }
  .product ul { margin:0 0 20px 20px; line-height:1.8; }
  .buy { background:var(--orange); color:#fff; border:none; font-size:18px; font-weight:700; padding:14px 32px; border-radius:10px; cursor:pointer; margin-top:10px; }
  .buy:hover { background:#c9620f; }
  .back { background:none; border:none; color:var(--orange); font-weight:600; cursor:pointer; margin-bottom:16px; font-size:15px; }
  .hero { background:linear-gradient(135deg,var(--orange),#f4a340); color:#fff; border-radius:14px; padding:40px; margin-bottom:32px; }
  .hero h2 { font-size:34px; margin-bottom:8px; }
  .contact { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px; font-size:20px; }
  #nope { position:fixed; inset:0; background:#000; color:#fff; display:none; align-items:center; justify-content:center; text-align:center; font-size:clamp(28px,6vw,64px); font-weight:800; padding:20px; z-index:99; cursor:pointer; }
  #nope.show { display:flex; }
  @media (max-width:700px){ .product{grid-template-columns:1fr;} header{padding:12px 16px;} }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="go('')">
    <h1>Tygrysica</h1>
    <small>Sklep dla tygrysów</small>
  </div>
  <nav>
    <button onclick="go('produkty')">Produkty</button>
    <button onclick="go('kontakt')">Kontakt</button>
  </nav>
</header>

<main id="app"></main>

<div id="nope" onclick="closeNope()">Dzień Dobry, poproszę, pół kilo arbuza. Dzień Dobry, 5 złoty, aż sam bym sobie zjadł.</div>

<script>
  // Zdjęcie: wrzuć plik klatka.png (lub klatka.jpg) obok index.html.
  // Gdy go nie ma, pokazuje się prosty rysunek zastępczy.
  const FALLBACK_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#fff"/>' +
    '<polygon points="40,130 330,150 360,210 70,195" fill="#222"/>' +
    '<polygon points="40,70 330,85 330,150 40,130" fill="none" stroke="#333" stroke-width="2"/>' +
    '<polygon points="40,70 90,40 380,60 330,85" fill="none" stroke="#333" stroke-width="2"/>' +
    '<g stroke="#333" stroke-width="1">' +
    Array.from({length:18},(_, i)=>`<line x1="${40+i*18}" y1="${70+i*3.4}" x2="${40+i*18}" y2="${130+i*1.1}"/>`).join('') +
    '</g></svg>');

  function imgTag(){
    return `<img src="klatka.png" alt="Klatka na tygrysa" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='klatka.jpg'}else{this.onerror=null;this.src='${FALLBACK_SVG}'}">`;
  }

  const views = {
    '': () => `
      <div class="hero"><h2>Witaj w Tygrysicy!</h2><p>Wszystko, czego potrzebuje Twój tygrys.</p></div>
      <h2>Polecane</h2>${list()}`,
    'produkty': () => `<h2>Produkty</h2>${list()}`,
    'kontakt': () => `<h2>Kontakt</h2>
      <div class="contact">Strona i reklama zrobiona przez: Kacper Gąsiorek i Alan Kupiec</div>`,
    'klatka': () => `
      <button class="back" onclick="go('produkty')">← Wróć do produktów</button>
      <div class="product">
        <div>${imgTag()}</div>
        <div>
          <h2>Klatka na tygrysa</h2>
          <div class="price">1 000,00 zł</div>
          <p>Solidna, przestronna klatka z czarną, głęboką podstawą i wzmocnioną siatką. Idealna dla tygrysa, który ceni sobie prywatność.</p>
          <ul>
            <li>Czarna stalowa siatka</li>
            <li>Głęboka, łatwa do czyszczenia podstawa</li>
            <li>Wygodne drzwiczki z boku</li>
            <li>Łatwy montaż</li>
            <li>3 Darty do Uśpienia tygrysa.</li>
          </ul>
          <button class="buy" onclick="openNope()">Kup Za chwile</button>
        </div>
      </div>`
  };

  function list(){
    return `<div class="grid">
      <div class="card" onclick="go('klatka')">
        <div class="img">${imgTag()}</div>
        <div class="info"><h3>Klatka na tygrysa</h3><div class="price">1 000,00 zł</div></div>
      </div></div>`;
  }

  function go(p){ location.hash = p; }
  function render(){
    const p = location.hash.replace('#','');
    document.getElementById('app').innerHTML = (views[p] || views[''])();
    window.scrollTo(0,0);
  }
  function openNope(){ document.getElementById('nope').classList.add('show'); }
  function closeNope(){ document.getElementById('nope').classList.remove('show'); }
  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
